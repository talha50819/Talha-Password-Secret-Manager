# cargo-deny policy — see docs/10-devsecops-cicd.md and docs/05-security-hardening.md §5.5.
# Run locally with: cargo deny check

[graph]
targets = []

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"

[licenses]
# Permissive, widely-vetted licenses only. Anything outside this list fails CI and must be
# reviewed deliberately (either the allowlist is extended with justification, or the dependency
# is replaced).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # OSI-approved, FSF-free permissive license used by clipboard-win/error-code
    # (transitive, Windows-only deps of arboard's clipboard backend).
    "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # Explicitly banned: pulling any of these into vault-core would silently break the
    # zero-networking guarantee in the threat model (docs/03-threat-model.md).
    { name = "reqwest" },
    { name = "hyper" },
    { name = "tokio" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
