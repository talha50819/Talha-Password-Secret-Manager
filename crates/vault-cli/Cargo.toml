[package]
name = "vault-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Vaultkeep CLI binary."

[[bin]]
name = "vaultkeep"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.5.61", features = ["derive"] }
clap_complete = "4.5.67"
ctrlc = "3.5.2"
rpassword = "7.4.0"
serde_json = "1.0.151"
sha2 = "0.10.9"
shlex = "2.0.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.20.0", features = ["v4", "serde"] }
vault-core = { path = "../vault-core", version = "0.1.0" }

[dev-dependencies]
assert_cmd = "2.1.2"
predicates = "3.1.4"
tempfile = "3.27.0"
